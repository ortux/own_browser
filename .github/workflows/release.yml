name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Automated build from commit ${{ github.sha }}

            **Includes:**
            - Linux: AppImage, .deb
            - Windows: NSIS installer, Portable
          draft: true
          prerelease: false

  build:
    name: Build (${{ matrix.os }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 \
            libcairo2

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare bundled Chromium
        run: npm run prepare:whatsapp-chrome

      - name: Package (Linux)
        run: npx electron-builder --linux --publish never
        if: matrix.platform == 'linux'

      - name: Package (Windows)
        run: npx electron-builder --win nsis portable --publish never
        if: matrix.platform == 'win'

      - name: Upload Linux release files
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          shopt -s nullglob
          files=(release/*.AppImage release/*.deb release/*.yml release/*.blockmap)
          if ((${#files[@]} == 0)); then
            echo 'No Linux release files were produced.' >&2
            exit 1
          fi
          gh release upload "v${{ github.run_number }}" "${files[@]}" --clobber

      - name: Upload Windows release files
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release\* -File -Include *.exe, *.yml, *.blockmap
          if (-not $files) {
            throw 'No Windows release files were produced.'
          }
          $installer = $files | Where-Object { $_.Name -match '-setup\.exe$' }
          if (-not $installer) {
            throw 'No NSIS installer was produced.'
          }
          gh release upload "v${{ github.run_number }}" $files.FullName --clobber

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub Release
        run: gh release edit "v${{ github.run_number }}" --repo "${{ github.repository }}" --draft=false
