<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self' https: wss: https://api-zyphora.obliqllc.xyz; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <title>Zyphora</title>

    <style>
      /*
       * Painted before the bundle parses so the window never flashes white.
       * Deliberately just a background colour: React mounts within a frame or
       * two, and an animated splash here would be a loading indicator for a
       * wait the user does not actually have.
       */
      html {
        background: #141416;
      }
      html[data-theme='light'] {
        background: #f6f6f7;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
